context = """
The board's own upkeep lands here: the Maintenance tickets for Context packs, Lexicon,
Tag vocabulary and Doctrine (atelier r853).
.atelier/packs.toml holds one [tags.<slug>] per tag. A pack line names a file or a command;
one that does not gets cut. `atelier --project shader-demo-conf doctor context_packs` lists paths that moved.
Lexicon: `atelier --project shader-demo-conf term list`; a new word:
  atelier --project shader-demo-conf term add "<word>" --short "<one line>" --tags <tag>
.atelier/doctrine.md holds Simon's lines once he approves them. A change to one is a doubt
(`atelier ask`), never an edit.
README.md is two lines pointing at ThreeJS_Shader.pdf; there is no CLAUDE.md yet.
The talk is French, the site's text English.
"""
